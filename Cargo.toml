[workspace]
members = ["crates/annflat-core", "crates/annflat-py"]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["Mukunda Katta"]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/MukundaKatta/annflat"
homepage = "https://github.com/MukundaKatta/annflat"
documentation = "https://docs.rs/annflat-core"
readme = "README.md"
keywords = ["ann", "knn", "vector-search", "embeddings", "rag"]
categories = ["science", "algorithms"]

[workspace.dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = ">=1.10, <1.13"
# Keep the transitive rayon-core resolver below the Rust 1.80 line while the
# workspace advertises Rust 1.75 support.
rayon-core = ">=1.12, <1.13"
serde = { version = "1.0", features = ["derive"] }
# pyo3-macros-backend permits newer rustc-hash releases, but 2.1 raised
# its rust-version above this workspace's MSRV.
rustc-hash = ">=2.0, <2.1"
# JSON persistence for `Index::save` / `Index::load`. Core-only.
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
